# Auto-deploy static site to GitHub Pages on every push to main
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:   # Allow manual trigger from Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deploy folder
        run: |
          mkdir -p _site
          # Rename index.html.html → index.html for GitHub Pages
          cp index.html.html _site/index.html
          # Copy assets
          cp -r images _site/images
          # Copy optional files
          [ -f DESIGN.md  ] && cp DESIGN.md  _site/DESIGN.md  || true
          [ -f README.md  ] && cp README.md  _site/README.md  || true
          echo "✅ Site folder contents:"
          ls -lh _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'   # Deploy only the prepared folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
